name: Build Samsung TV KeepAlive ARM64

on:
  workflow_dispatch:
  push:
    branches: [ clean-1.5.1-keepalive ]

permissions:
  contents: read

jobs:
  build:
    name: Build ARM64 Samsung TV driver
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: https://github.com/JackJPowell/uc-intg-samsungtv.git
      UPSTREAM_COMMIT: b4ebefd8299368336fab0d892fda1032d6213b63
      PYINSTALLER_IMAGE: unfoldedcircle/r2-pyinstaller:3.11.13
      TEST_VERSION: 1.5.2-test.2
      ARTIFACT_NAME: uc-intg-samsungtv_driver-1.5.2-test.2-aarch64.tar.gz

    steps:
      - name: Checkout clean project
        uses: actions/checkout@v4

      - name: Setup QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Validate custom files before build
        run: |
          python3 -m py_compile scripts/apply_keepalive.py
          bash -n scripts/build_remote3.sh
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('driver.json').read_text())
          assert d['driver_id']=='samsungtv_driver'
          assert d['version']=='1.5.2-test.2'
          assert 'setup_data_schema' in d
          assert d['setup_data_schema']['settings'][0]['id']=='info'
          print('Custom metadata OK')
          PY
          grep -q 'await asyncio.sleep(3600)' scripts/apply_keepalive.py
          grep -q 'ip_address=self._local_broadcast_address()' scripts/apply_keepalive.py
          grep -q 'netifaces' runtime-reference.txt
          grep -q 'attrs==25.3.0' runtime-reference.txt
          grep -q 'cffi==1.17.1' runtime-reference.txt
          grep -q 'cryptography==44.0.2' runtime-reference.txt
          grep -q 'websockets==15.0.1' runtime-reference.txt
          grep -q 'zeroconf==0.146.5' runtime-reference.txt

      - name: Fetch exact upstream source
        run: |
          rm -rf /tmp/samsungtv-source
          git clone --depth 1 https://github.com/JackJPowell/uc-intg-samsungtv.git /tmp/samsungtv-source
          git -C /tmp/samsungtv-source fetch --depth 1 origin "${UPSTREAM_COMMIT}"
          git -C /tmp/samsungtv-source checkout --detach "${UPSTREAM_COMMIT}"
          test "$(git -C /tmp/samsungtv-source rev-parse HEAD)" = "${UPSTREAM_COMMIT}"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/samsungtv-source/driver.json').read_text())
          assert d['version']=='1.5.0'
          print('Official v1.5.0 source OK')
          PY

      - name: Apply only the two intended code changes
        run: python3 scripts/apply_keepalive.py
        env:
          SAMSUNG_SOURCE_DIR: /tmp/samsungtv-source

      - name: Validate patch scope and source syntax
        run: |
          python3 -m py_compile /tmp/samsungtv-source/intg-samsungtv/tv.py
          test "$(git -C /tmp/samsungtv-source diff --name-only | wc -l)" -eq 1
          test "$(git -C /tmp/samsungtv-source diff --name-only)" = "intg-samsungtv/tv.py"
          grep -q 'Samsung REST keep-alive' /tmp/samsungtv-source/intg-samsungtv/tv.py
          grep -q 'await asyncio.sleep(3600)' /tmp/samsungtv-source/intg-samsungtv/tv.py
          grep -q 'ip_address=self._local_broadcast_address()' /tmp/samsungtv-source/intg-samsungtv/tv.py

      - name: Build in isolated reference runtime
        run: |
          rm -rf /tmp/build
          mkdir -p /tmp/build
          chmod 777 /tmp/build
          docker run --rm --platform linux/arm64 \
            -v /tmp/samsungtv-source:/workspace:ro \
            -v /tmp/build:/build \
            -v "$GITHUB_WORKSPACE/scripts:/project-scripts:ro" \
            -w /build \
            "${PYINSTALLER_IMAGE}" \
            bash /project-scripts/build_remote3.sh

      - name: Assemble and validate artifact
        run: |
          rm -rf /tmp/package
          mkdir -p /tmp/package/bin
          cp -a /tmp/build/dist/driver/. /tmp/package/bin/
          cp driver.json /tmp/package/driver.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/package/driver.json').read_text())
          assert d['driver_id']=='samsungtv_driver'
          assert d['version']=='1.5.2-test.2'
          assert 'setup_data_schema' in d
          assert d['setup_data_schema']['settings'][0]['id']=='info'
          print('Artifact metadata OK')
          PY
          test -x /tmp/package/bin/driver
          file /tmp/package/bin/driver | grep -qi 'ARM aarch64'
          test -f /tmp/package/bin/_internal/_netifaces.cpython-311-aarch64-linux-gnu.so
          test -f /tmp/package/bin/_cffi_backend.cpython-311-aarch64-linux-gnu.so
          test -d /tmp/package/bin/_internal/attrs-25.3.0.dist-info
          test -d /tmp/package/bin/_internal/cryptography-44.0.2.dist-info
          test -d /tmp/package/bin/_internal/websockets-15.0.1.dist-info
          test -d /tmp/package/bin/_internal/zeroconf-0.146.5.dist-info
          test ! -e /tmp/package/bin/_internal/cryptography-49.0.0.dist-info
          test ! -e /tmp/package/bin/_internal/pydantic
          test ! -e /tmp/package/bin/_internal/pydantic_core
          tar -C /tmp/package -czf "${ARTIFACT_NAME}" .
          tar -tzf "${ARTIFACT_NAME}" | grep -qx './driver.json'
          tar -tzf "${ARTIFACT_NAME}" | grep -qx './bin/driver'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uc-intg-samsungtv_driver-1.5.2-test.2-aarch64
          path: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
