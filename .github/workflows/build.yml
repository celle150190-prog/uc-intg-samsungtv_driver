name: Build Samsung TV KeepAlive ARM64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYINSTALLER_IMAGE: unfoldedcircle/r2-pyinstaller:3.11.13
      UPSTREAM_REPO: https://github.com/JackJPowell/uc-intg-samsungtv.git
      UPSTREAM_TAG: v1.5.0
      ARTIFACT_NAME: uc-intg-samsungtv_driver-1.5.2-test.5-aarch64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Setup QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Checkout upstream source
        run: |
          rm -rf /tmp/samsungtv-source
          git clone --depth 1 --branch "${UPSTREAM_TAG}" "${UPSTREAM_REPO}" /tmp/samsungtv-source

      - name: Validate source
        working-directory: /tmp/samsungtv-source
        run: |
          test -f driver.json
          test -f intg-samsungtv/driver.py
          test -f intg-samsungtv/tv.py

      - name: Patch source
        run: python3 "$GITHUB_WORKSPACE/scripts/apply_keepalive.py"
        env:
          SAMSUNG_SOURCE_DIR: /tmp/samsungtv-source

      - name: Validate patched source
        working-directory: /tmp/samsungtv-source
        run: |
          python3 -m py_compile intg-samsungtv/tv.py
          grep -q 'Samsung REST keep-alive' intg-samsungtv/tv.py
          grep -q 'netifaces' intg-samsungtv/tv.py

      - name: Build with Remote 3 Python 3.11.13 image
        run: |
          rm -rf /tmp/pyinstaller-work
          mkdir -p /tmp/pyinstaller-work
          chmod 777 /tmp/pyinstaller-work
          docker run --rm --platform linux/arm64 \
            -v /tmp/samsungtv-source:/workspace:ro \
            -v /tmp/pyinstaller-work:/build \
            -w /build \
            "${PYINSTALLER_IMAGE}" \
            bash -lc '
              set -euo pipefail
              python --version
              python -m pip install --upgrade pip
              python -m pip install -r /workspace/requirements.txt
              pyinstaller --clean --onedir --name driver \
                --paths /workspace/intg-samsungtv \
                /workspace/intg-samsungtv/driver.py
            '

      - name: Assemble and validate Remote 3 archive
        run: |
          rm -rf /tmp/package
          mkdir -p /tmp/package/bin
          cp -a /tmp/pyinstaller-work/dist/driver/. /tmp/package/bin/
          cp driver.json /tmp/package/driver.json
          tar -C /tmp/package -czf "${ARTIFACT_NAME}" .
          tar -tzf "${ARTIFACT_NAME}" | grep -q '^./bin/driver$'
          tar -tzf "${ARTIFACT_NAME}" | grep -q '^./driver.json$'
          file /tmp/package/bin/driver | grep -qi 'ARM aarch64'
          grep -q '"version": "1.5.2-test.5"' driver.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uc-intg-samsungtv_driver-1.5.2-test.5-aarch64
          path: ${{ env.ARTIFACT_NAME }}
