name: Build Samsung TV KeepAlive ARM64

on:
  workflow_dispatch:
  push:
    branches: [ clean-1.5.1-keepalive ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: https://github.com/JackJPowell/uc-intg-samsungtv.git
      UPSTREAM_COMMIT: b4ebefd8299368336fab0d892fda1032d6213b63
      PYINSTALLER_IMAGE: unfoldedcircle/r2-pyinstaller:3.11.13
      TEST_VERSION: 1.5.2-test.1
      ARTIFACT_NAME: uc-intg-samsungtv_driver-1.5.2-test.1-aarch64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Setup QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Validate custom files
        run: |
          python3 -m py_compile scripts/apply_keepalive.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('driver.json').read_text())
          assert d['driver_id']=='samsungtv_driver'
          assert d['version']=='1.5.2-test.1'
          assert 'setup_data_schema' in d
          assert d['setup_data_schema']['settings'][0]['id']=='info'
          print('Custom metadata OK')
          PY

      - name: Fetch exact upstream source
        run: |
          rm -rf /tmp/samsungtv-source
          git clone --depth 1 https://github.com/JackJPowell/uc-intg-samsungtv.git /tmp/samsungtv-source
          git -C /tmp/samsungtv-source fetch --depth 1 origin "${UPSTREAM_COMMIT}"
          git -C /tmp/samsungtv-source checkout --detach "${UPSTREAM_COMMIT}"
          test "$(git -C /tmp/samsungtv-source rev-parse HEAD)" = "${UPSTREAM_COMMIT}"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/samsungtv-source/driver.json').read_text())
          assert d['version']=='1.5.0'
          assert 'setup_data_schema' in d
          print('Upstream v1.5.0 metadata OK')
          PY

      - name: Apply only the known patches
        run: python3 scripts/apply_keepalive.py
        env:
          SAMSUNG_SOURCE_DIR: /tmp/samsungtv-source

      - name: Validate patch scope and syntax
        run: |
          python3 -m py_compile /tmp/samsungtv-source/intg-samsungtv/tv.py
          test "$(git -C /tmp/samsungtv-source diff --name-only | wc -l)" -eq 1
          test "$(git -C /tmp/samsungtv-source diff --name-only)" = "intg-samsungtv/tv.py"
          grep -q 'await asyncio.sleep(3600)' /tmp/samsungtv-source/intg-samsungtv/tv.py
          grep -q 'ip_address=self._local_broadcast_address()' /tmp/samsungtv-source/intg-samsungtv/tv.py

      - name: Build using Remote 3 container
        run: |
          rm -rf /tmp/build
          mkdir -p /tmp/build
          chmod 777 /tmp/build
          docker run --rm --platform linux/arm64 \
            -v /tmp/samsungtv-source:/workspace:ro \
            -v /tmp/build:/build \
            -w /build \
            "${PYINSTALLER_IMAGE}" \
            bash -c 'python -m pip install --upgrade pip && python -m pip install -r /workspace/requirements.txt netifaces==0.11.0 pyinstaller && pyinstaller --clean --onedir --name driver --paths /workspace/intg-samsungtv /workspace/intg-samsungtv/driver.py'

      - name: Assemble archive
        run: |
          rm -rf /tmp/package
          mkdir -p /tmp/package/bin
          cp -a /tmp/build/dist/driver/. /tmp/package/bin/
          cp driver.json /tmp/package/driver.json
          test -x /tmp/package/bin/driver
          file /tmp/package/bin/driver | grep -qi 'ARM aarch64'
          test -f /tmp/package/bin/_internal/_netifaces.cpython-311-aarch64-linux-gnu.so
          tar -C /tmp/package -czf "${ARTIFACT_NAME}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uc-intg-samsungtv_driver-1.5.2-test.1-aarch64
          path: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
